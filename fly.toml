# Fly.io config. Change `app` to the name you pick with `fly launch` (it must be unique on Fly).
# Sydney is the closest region to Perth.
app = "tradebench"
primary_region = "syd"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  UPLOAD_DIR = "/data/uploads"

# The database and uploaded photos live on this volume. Create it once with:
#   fly volumes create tradebench_data --region syd --size 3
[[mounts]]
  source = "tradebench_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # One machine, always on: SQLite lives on its disk, and reminders and backups run inside it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
